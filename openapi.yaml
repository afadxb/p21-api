openapi: 3.0.3
info:
  title: P21 API
  version: 1.1.0
  description: >
    REST API interface to Prophet 21 ERP (SQL Server) for sales order, purchase
    order and accounts payable integrations.


    Sales (`/v1/sales`) and Accounts Payable (`/v1/ap`) endpoints require an API
    key, sent as the `apikey` header or `apikey` query parameter. Use the
    Authorize button to set it for Try it out.

servers:
  - url: https://api.accuratefasteners.com
    description: Production
  - url: http://localhost:3000
    description: Local development

security:
  - ApiKeyHeader: []
  - ApiKeyQuery: []

tags:
  - name: Health
  - name: Sales
  - name: Inventory
  - name: Accounts Payable
  - name: System

paths:
  /health:
    get:
      tags: [Health]
      security: []
      summary: Health check
      responses:
        '200':
          description: Service status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptime:
                    type: number
                    example: 123.45

  # ── Sales ─────────────────────────────────────────────────────────────

  /v1/sales/order:
    post:
      tags: [Sales]
      summary: Create one or more sales orders
      description: >
        Accepts a batch of orders or a single order object. Each order must
        include a header and at least one line. Lines without a unitPrice
        require a contractNumber on the header. Inbound contractBinId values
        on lines are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SalesOrderBatchRequest'
                - $ref: '#/components/schemas/SalesOrderSingleRequest'
            examples:
              batch:
                summary: Batch of orders
                value:
                  orders:
                    - header:
                        customerId: 1234
                        companyId: "01"
                        salesLocationId: 1
                        shipToId: 5678
                        customerPoNumber: "PO-100"
                        taker: "API"
                        approved: "N"
                      lines:
                        - itemId: "WIDGET-A"
                          unitQuantity: 10
                          unitOfMeasure: "EA"
                          unitPrice: "25.00"
              single:
                summary: Single order
                value:
                  header:
                    customerId: 1234
                    companyId: "01"
                    salesLocationId: 1
                    shipToId: 5678
                  lines:
                    - itemId: "WIDGET-A"
                      unitQuantity: 5
                      unitOfMeasure: "EA"
                      unitPrice: "25.00"
      responses:
        '201':
          description: Sales orders accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Sales orders Accepted
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/SalesOrderCreatedResponse'
        '400':
          description: Validation error (missing required fields, no lines, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error

  /v1/sales/order/_debug:
    get:
      tags: [Sales]
      summary: Debug endpoint for DB connection and order lookup
      description: >
        Only available when ENABLE_DEBUG_ROUTES=true. Returns connection info
        and optional order lookup results.
      parameters:
        - in: query
          name: order
          schema:
            type: string
          description: Order number or job name to look up
        - in: query
          name: order_id
          schema:
            type: string
          description: Alias for order
        - in: query
          name: id
          schema:
            type: string
          description: Alias for order
      responses:
        '200':
          description: Debug info
          content:
            application/json:
              schema:
                type: object
                properties:
                  connection:
                    type: object
                    properties:
                      db:
                        type: string
                      server:
                        type: string
                      login:
                        type: string
                      system_user:
                        type: string
                  input:
                    type: object
                    properties:
                      order:
                        type: string
                        nullable: true
                  checks:
                    type: object
                    properties:
                      headerCount:
                        type: integer
                        nullable: true
                      headerSample:
                        type: object
                        nullable: true
                      lineCount:
                        type: integer
                        nullable: true
        '403':
          description: Debug routes disabled

  /v1/sales/order/{order_id}:
    get:
      tags: [Sales]
      summary: Get a sales order by order number or job name
      parameters:
        - in: path
          name: order_id
          required: true
          schema:
            type: string
          description: Numeric order_no or job_name string
      responses:
        '200':
          description: Sales order with header and lines
          content:
            application/json:
              schema:
                type: object
                properties:
                  header:
                    $ref: '#/components/schemas/SalesOrderHeader'
                  lines:
                    type: array
                    items:
                      $ref: '#/components/schemas/SalesOrderLine'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── Inventory ─────────────────────────────────────────────────────────

  /v1/inventory/items:
    get:
      tags: [Inventory]
      security: []
      summary: List inventory items
      parameters:
        - in: query
          name: paging
          schema:
            type: string
            enum: ['true', 'false']
            default: 'false'
          description: >
            When "true", returns the requested page and the full totalCount.
            When "false", returns the first `limit` items and `page` is ignored.
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number. Only applies when paging=true.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            default: 100
        - in: query
          name: inactive
          schema:
            type: string
            enum: ['true', 'false']
          description: Filter by inactive flag. "false" returns active items only.
        - in: query
          name: order
          schema:
            type: string
            enum: [ASC, DESC]
            default: ASC
          description: Sort direction for item_id
      responses:
        '200':
          description: Paginated items list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        item_id:
                          type: string
                        item_desc:
                          type: string
                  totalCount:
                    type: integer
                  page:
                    type: integer
                  totalPages:
                    type: integer

  /v1/inventory/items/{item_id}:
    get:
      tags: [Inventory]
      security: []
      summary: Get a single inventory item
      parameters:
        - in: path
          name: item_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Item details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
        '404':
          description: Item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── Accounts Payable ──────────────────────────────────────────────────

  /v1/ap/suppliers:
    get:
      tags: [Accounts Payable]
      summary: List suppliers
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 500
          description: Also accepts page_size or pageSize.
        - in: query
          name: updated_since
          schema:
            type: string
            format: date-time
          description: ISO 8601 date. Also accepts updatedSince.
        - in: query
          name: company
          schema:
            type: string
          description: Filter by company_id
      responses:
        '200':
          description: Paginated supplier list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Supplier'
                  page:
                    type: integer
                  limit:
                    type: integer
                  total:
                    type: integer
                  totalPages:
                    type: integer
                  lastPage:
                    type: boolean
        '400':
          description: Invalid updatedSince parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/ap/paymentterms:
    get:
      tags: [Accounts Payable]
      summary: List payment terms
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 500
          description: Also accepts page_size or pageSize.
        - in: query
          name: updated_since
          schema:
            type: string
            format: date-time
          description: ISO 8601 date filter on terms.date_last_modified
        - in: query
          name: companyId
          schema:
            type: string
          description: Prepended to externalSystemId when provided
      responses:
        '200':
          description: Paginated payment terms list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentTerm'
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  total:
                    type: integer
                  totalPages:
                    type: integer
                  lastPage:
                    type: boolean
        '400':
          description: Invalid updated_since parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/ap/purchaseorders:
    get:
      tags: [Accounts Payable]
      summary: List purchase orders
      description: >
        Returns purchase orders with nested lines and comments.
        Only orders with order_date >= 2020-01-01 are included.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 500
          description: Also accepts pageSize or page_size.
        - in: query
          name: company
          schema:
            type: string
          description: Filter by company_no. Also accepts companyId.
        - in: query
          name: vendor
          schema:
            type: string
          description: Filter by vendor_id. Also accepts vendorId.
        - in: query
          name: po_no
          schema:
            type: string
          description: Filter by PO number. Also accepts poNo or poNumber.
        - in: query
          name: updated_since
          schema:
            type: string
            format: date-time
          description: ISO 8601 date. Also accepts updatedSince.
        - in: query
          name: order_date_from
          schema:
            type: string
            format: date-time
          description: Also accepts orderDateFrom.
        - in: query
          name: order_date_to
          schema:
            type: string
            format: date-time
          description: Also accepts orderDateTo.
      responses:
        '200':
          description: Paginated purchase orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  purchaseOrders:
                    type: array
                    items:
                      $ref: '#/components/schemas/PurchaseOrder'
                  footer:
                    $ref: '#/components/schemas/PaginationFooter'
        '400':
          description: Invalid filter values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/ap/purchaseorders/{poNo}:
    get:
      tags: [Accounts Payable]
      summary: Get a single purchase order
      parameters:
        - in: path
          name: poNo
          required: true
          schema:
            type: string
        - in: query
          name: company
          schema:
            type: string
          description: Also accepts companyId.
        - in: query
          name: updated_since
          schema:
            type: string
            format: date-time
          description: Also accepts updatedSince.
      responses:
        '200':
          description: Purchase order with lines and comments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '404':
          description: Purchase order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/ap/paymentdetail:
    get:
      tags: [Accounts Payable]
      summary: List payment details
      description: >
        Returns voucher-grouped payment details with nested payment lines.
        Only rows with a non-null check_date are included.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 500
          description: Also accepts page_size or pageSize.
        - in: query
          name: updated_since
          schema:
            type: string
            format: date-time
          description: ISO 8601 date. Also accepts updatedSince.
        - in: query
          name: check_date
          schema:
            type: string
            format: date
          description: Filter by exact check date. Also accepts checkDate.
        - in: query
          name: company
          schema:
            type: string
        - in: query
          name: vendor
          schema:
            type: string
        - in: query
          name: voucherNo
          schema:
            type: string
        - in: query
          name: invoiceNo
          schema:
            type: string
        - in: query
          name: poNo
          schema:
            type: string
      responses:
        '200':
          description: Paginated payment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDetailListResponse'
        '400':
          description: Invalid filter values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/ap/receipts:
    get:
      tags: [Accounts Payable]
      summary: List inventory receipts
      description: >
        Returns receipts with nested line items. Only non-deleted receipts
        with date_created >= 2020-01-01 are included.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 500
          description: Also accepts page_size or pageSize.
        - in: query
          name: receipt_number
          schema:
            type: integer
          description: Also accepts receiptNumber.
        - in: query
          name: po_number
          schema:
            type: integer
          description: Also accepts poNumber.
        - in: query
          name: updated_since
          schema:
            type: string
            format: date-time
          description: ISO 8601 date. Also accepts updatedSince.
      responses:
        '200':
          description: Paginated receipts
          content:
            application/json:
              schema:
                type: object
                properties:
                  receipts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Receipt'
                  page:
                    type: integer
                  limit:
                    type: integer
                  total:
                    type: integer
                  totalPages:
                    type: integer
                  lastPage:
                    type: boolean
        '400':
          description: Invalid filter values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/ap/voucher:
    get:
      tags: [Accounts Payable]
      summary: List vouchers
      description: >
        Returns voucher headers with nested detail lines (LINE, CHARGE, VAT).
        Only vouchers with date_created >= 2020-01-01 are included.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 500
          description: Also accepts page_size or pageSize.
        - in: query
          name: voucher
          schema:
            type: integer
          description: Filter by voucher number. Also accepts voucherNo or voucher_no.
        - in: query
          name: vendor
          schema:
            type: integer
          description: Filter by vendor ID. Also accepts vendorId or vendor_id.
        - in: query
          name: updated_since
          schema:
            type: string
            format: date-time
          description: ISO 8601 date. Also accepts updatedSince.
      responses:
        '200':
          description: Paginated voucher list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VoucherEnvelope'
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  total:
                    type: integer
                  totalPages:
                    type: integer
                  lastPage:
                    type: boolean
        '400':
          description: Invalid filter values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── System ────────────────────────────────────────────────────────────

  /v1/system/exch_rates:
    get:
      tags: [System]
      security: []
      summary: List current exchange rates
      responses:
        '200':
          description: Exchange rates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExchangeRate'

  /v1/system/periods:
    get:
      tags: [System]
      security: []
      summary: List periods for the current year
      responses:
        '200':
          description: Periods for the current calendar year
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Period'

  /v1/system/periods/{year}:
    get:
      tags: [System]
      security: []
      summary: List periods for a specific year
      parameters:
        - in: path
          name: year
          required: true
          schema:
            type: integer
          description: Four-digit year
      responses:
        '200':
          description: Periods for the given year
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Period'
        '400':
          description: Invalid year parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: apikey
    ApiKeyQuery:
      type: apiKey
      in: query
      name: apikey

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    # ── Sales schemas ───────────────────────────────────────────────────

    SalesOrderSingleRequest:
      type: object
      required: [header, lines]
      properties:
        header:
          $ref: '#/components/schemas/SalesOrderInputHeader'
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SalesOrderInputLine'

    SalesOrderBatchRequest:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SalesOrderSingleRequest'

    SalesOrderInputHeader:
      type: object
      required:
        - customerId
        - companyId
        - salesLocationId
        - shipToId
      properties:
        customerId:
          type: number
        customerName:
          type: string
        companyId:
          type: string
        salesLocationId:
          type: number
        customerPoNumber:
          type: string
        contactId:
          type: string
        contactName:
          type: string
        taker:
          type: string
          default: API
        jobName:
          type: string
        orderDate:
          type: string
          description: YYYYMMDD format
        requiredDate:
          type: string
          description: YYYYMMDD format
        quote:
          type: string
          enum: ['Y', 'N']
        approved:
          type: string
          enum: ['Y', 'N']
          default: 'N'
        shipToId:
          type: number
        shipToName:
          type: string
        shipToAddress1:
          type: string
        shipToAddress2:
          type: string
        shipToCity:
          type: string
        shipToState:
          type: string
        shipToZipCode:
          type: string
        shipToCountry:
          type: string
        sourceLocationId:
          type: number
        carrierId:
          type: number
        carrierName:
          type: string
        route:
          type: string
        packingBasis:
          type: string
        deliveryInstructions:
          type: string
        terms:
          type: string
        termsDesc:
          type: string
        willCall:
          type: string
          enum: ['Y', 'N']
        class1:
          type: string
        class2:
          type: string
        class3:
          type: string
        class4:
          type: string
        class5:
          type: string
        rmaFlag:
          type: string
          enum: ['Y', 'N']
        freightCode:
          type: string
        thirdPartyBillingFlagDesc:
          type: string
        captureUsageDefault:
          type: string
          enum: ['Y', 'N']
        allocate:
          type: string
          enum: ['Y', 'N']
        contractNumber:
          type: string
        invoiceBatchNumber:
          type: string
        shipToEmailAddress:
          type: string
        setInvoiceExchangeRateSourceDesc:
          type: string
        shipToPhone:
          type: string
        currencyId:
          type: string
        applyBuilderAllowanceFlag:
          type: string
          enum: ['Y', 'N']
        quoteExpirationDate:
          type: string
          description: YYYYMMDD format
        promiseDate:
          type: string
          description: YYYYMMDD format

    SalesOrderInputLine:
      type: object
      required:
        - itemId
        - unitQuantity
        - unitOfMeasure
      properties:
        itemId:
          type: string
        unitQuantity:
          type: number
        unitOfMeasure:
          type: string
        unitPrice:
          type: string
          description: Required when header has no contractNumber
        extendedDescription:
          type: string
        sourceLocationId:
          type: number
        shipLocationId:
          type: number
        productGroupId:
          type: string
        supplierId:
          type: number
        supplierName:
          type: string
        requiredDate:
          type: string
          description: YYYYMMDD format
        expediteDate:
          type: string
          description: YYYYMMDD format
        willCall:
          type: string
          enum: ['Y', 'N']
        taxItem:
          type: string
          enum: ['Y', 'N']
        okToInterchange:
          type: string
          enum: ['Y', 'N']
        pricingUnit:
          type: string
        commissionCost:
          type: string
        otherCost:
          type: string
        poCost:
          type: string
        disposition:
          type: string
        scheduled:
          type: string
          enum: ['Y', 'N']
        manualPriceOverride:
          type: string
          enum: ['Y', 'N']
        commissionCostEdited:
          type: string
          enum: ['Y', 'N']
        otherCostEdited:
          type: string
          enum: ['Y', 'N']
        captureUsage:
          type: string
          enum: ['Y', 'N']
        tagAndHoldClassId:
          type: string
        contractNo:
          type: string
        allocationQty:
          type: number
        promiseDate:
          type: string
          description: YYYYMMDD format
        note:
          type: string
          maxLength: 512
          description: Optional note for this line item

    SalesOrderCreatedResponse:
      type: object
      properties:
        importSetNo:
          type: string
        linesInserted:
          type: integer
        referance1:
          type: string
          description: Present when jobName was provided

    SalesOrderHeader:
      type: object
      properties:
        order_no:
          type: integer
        customer_id:
          type: number
        order_date:
          type: string
          format: date-time
        ship2_name:
          type: string
        ship2_add1:
          type: string
        po_no:
          type: string
        job_price_hdr_uid:
          type: integer
        delete_flag:
          type: string
        completed:
          type: string
        company_id:
          type: string
        date_created:
          type: string
          format: date-time
        po_no_append:
          type: string
        location_id:
          type: number
        carrier_id:
          type: number
        address_id:
          type: number
        taker:
          type: string
        order_ref:
          type: string
          description: Original job_name value
        approved:
          type: string
        cancel_flag:
          type: string
        promise_date:
          type: string
          format: date-time
        ups_code:
          type: string
        expedite_date:
          type: string
          format: date-time
        validation_status:
          type: string
        status:
          type: string
          enum: [Canceled, Deleted, Completed, Unapproved, Open]

    SalesOrderLine:
      type: object
      properties:
        order_no:
          type: integer
        qty_ordered:
          type: number
        delete_flag:
          type: string
        line_no:
          type: number
        item_id:
          type: string
        customer_part_number:
          type: string
        complete:
          type: string
        disposition:
          type: string
        qty_allocated:
          type: number
        qty_on_pick_tickets:
          type: number
        qty_invoiced:
          type: number
        required_date:
